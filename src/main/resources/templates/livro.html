<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Gerenciamento de Livros</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#formModal"
                th:onclick="'limparFormulario()'">
            + Adicionar Livro
        </button>
    </div>

    <!-- Tabela de livros -->
    <table class="table table-bordered table-striped shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Autor</th>
            <th>ISBN</th>
            <th>Ano</th>
            <th>Categoria</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="livro : ${livros}">
            <td th:text="${livro.id}"></td>
            <td th:text="${livro.titulo}"></td>
            <td th:text="${livro.autor}"></td>
            <td th:text="${livro.isbn}"></td>
            <td th:text="${livro.ano}"></td>
            <td th:text="${livro.categoria}"></td>

            <td>
                <button class="btn btn-warning btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#formModal"
                        th:onclick="'editarLivro(' + ${livro.id} + ')'"
                >Editar</button>

                <a th:href="@{/livros/excluir/{id}(id=${livro.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Deseja realmente excluir?')">
                    Excluir
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>


<!-- ========================= -->
<!--      MODAL FORM          -->
<!-- ========================= -->

<div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <form th:action="@{/livros/salvar}" th:object="${livro}" method="post">

                <div class="modal-header">
                    <h5 class="modal-title">Cadastro de Livro</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <input type="hidden" th:field="*{id}" id="campo-id"/>

                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input th:field="*{titulo}" id="campo-titulo" class="form-control">
                        <small class="text-danger" th:errors="*{titulo}" th:if="${#fields.hasErrors('titulo')}"></small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Autor</label>
                        <input th:field="*{autor}" id="campo-autor" class="form-control">
                        <small class="text-danger" th:errors="*{autor}" th:if="${#fields.hasErrors('autor')}"></small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">ISBN</label>
                        <input th:field="*{isbn}" id="campo-isbn" class="form-control">
                        <small class="text-danger" th:errors="*{isbn}" th:if="${#fields.hasErrors('isbn')}"></small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Ano</label>
                        <input type="number" th:field="*{ano}" id="campo-ano" class="form-control">
                        <small class="text-danger" th:errors="*{ano}" th:if="${#fields.hasErrors('ano')}"></small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoria</label>
                        <input th:field="*{categoria}" id="campo-categoria" class="form-control">
                        <small class="text-danger" th:errors="*{categoria}" th:if="${#fields.hasErrors('categoria')}"></small>
                    </div>

                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-success" type="submit">Salvar</button>
                </div>

            </form>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script para preencher o formulário ao editar -->
<script>
    function editarLivro(id) {
        fetch("/livros/buscar/" + id)
            .then(res => res.json())
            .then(l => {
                document.getElementById("campo-id").value = l.id;
                document.getElementById("campo-titulo").value = l.titulo;
                document.getElementById("campo-autor").value = l.autor;
                document.getElementById("campo-isbn").value = l.isbn;
                document.getElementById("campo-ano").value = l.ano;
                document.getElementById("campo-categoria").value = l.categoria;
            });
    }

    function limparFormulario() {
        document.getElementById("campo-id").value = "";
        document.getElementById("campo-titulo").value = "";
        document.getElementById("campo-autor").value = "";
        document.getElementById("campo-isbn").value = "";
        document.getElementById("campo-ano").value = "";
        document.getElementById("campo-categoria").value = "";
    }
</script>

</body>
</html>
